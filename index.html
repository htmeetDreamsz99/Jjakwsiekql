<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
body {
    margin: 0;
    padding: 20px;
    background: radial-gradient(circle at 50% 50%, #000000 5%, #3a0000 35%, #050000 70%, #000000 100%);
    color: #ff0000;
    font-family: monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
}
h2 {
    text-shadow: 0 0 15px #ff0000;
    letter-spacing: 2px;
    text-transform: uppercase;
}
input, textarea {
    width: 90%;
    margin: 10px 0;
    padding: 12px;
    background: rgba(10, 0, 0, 0.8);
    border: 1px solid #4a0000;
    color: #ff3333;
    font-family: monospace;
    font-size: 16px;
    outline: none;
    box-sizing: border-box;
    box-shadow: inset 0 0 5px #000;
}
input::placeholder, textarea::placeholder {
    color: #880000;
}
.btn-container {
    position: relative;
    margin: 15px 0;
    width: 90%;
    border-radius: 4px;
}
.btn-container::before {
    content: "";
    position: absolute;
    top: -2px; left: -2px; right: -2px; bottom: -2px;
    background: linear-gradient(45deg, #ff0000, #ff7300, #fffb00, #48ff00, #00ffd5, #002bff, #7a00ff, #ff00c8, #ff0000);
    background-size: 400%;
    z-index: -1;
    animation: rgb 8s linear infinite;
    border-radius: 5px;
}
.btn {
    width: 100%;
    padding: 15px;
    background: #0a0000;
    color: #ff3333;
    border: none;
    border-radius: 3px;
    font-family: monospace;
    font-weight: bold;
    font-size: 16px;
    text-transform: uppercase;
    cursor: pointer;
    transition: transform 0.1s ease, background 0.2s;
    box-shadow: inset 0 0 10px rgba(255, 0, 0, 0.2);
}
.btn:active {
    transform: scale(0.96);
    background: #1a0000;
}
@keyframes rgb {
    0% { background-position: 0 0; }
    50% { background-position: 400% 0; }
    100% { background-position: 0 0; }
}
</style>
</head>
<body>
<h2>SLNC Admin</h2>
<input type="number" id="uid" placeholder="ID ЮЗЕРА">
<input type="number" id="amt" placeholder="КОЛИЧЕСТВО">
<textarea id="msg" placeholder="ТЕКСТ РАССЫЛКИ" rows="4"></textarea>

<div class="btn-container"><button class="btn" onclick="send('give')">ВЫДАТЬ ЗВЕЗДЫ</button></div>
<div class="btn-container"><button class="btn" onclick="send('take')">ЗАБРАТЬ ЗВЕЗДЫ</button></div>
<div class="btn-container"><button class="btn" onclick="send('ban')">ЗАБАНИТЬ ПО ID</button></div>
<div class="btn-container"><button class="btn" onclick="send('broadcast')">МАССОВАЯ РАССЫЛКА</button></div>

<script>
let tg = window.Telegram.WebApp;
tg.expand();
tg.ready();

function send(act) {
    let data = {
        action: act,
        uid: document.getElementById('uid').value,
        amt: document.getElementById('amt').value,
        msg: document.getElementById('msg').value
    };
    tg.sendData(JSON.stringify(data));
    tg.close();
}
</script>
</body>
</html>
